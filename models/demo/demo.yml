version: 2

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments: 
                values: ['1','2','3','4','5']
                config:
                  severity: warn 
      - name: emp_salary
        data_tests:
          - salary_check

  - name: customer
    description: "Customer DBT model"

  - name: customer_vw
    description: "Customer view DBT model"

  - name: sales 
    description: "Sales DBT model"

  - name: product
    description: 'Product DBT model'  

  - name: purchase
    description: 'Purchase DBT model'  

  - name: clean_orders
    description: 'Clean orders Ephemeral DBT model'    
          
  - name: final_orders
    description: 'Final orders DBT model'

  - name: session
    description: 'Session DBT model'


sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables: 
      - name: EMPLOYEE_RAW

  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC

  - name: sales 
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC

  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC

  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC

  - name: orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS 

  - name: patient
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PATIENT_SRC

  - name: session 
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SESSION_SRC
